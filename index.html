<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alons Tic Tac</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e8dfcf;
      --panel: #fff8ee;
      --paper: #fffdf7;
      --text: #201813;
      --x: #0d5b76;
      --o: #b74912;
      --line: #4b3123;
      --accent: #2f9e44;
      --wood-a: #c4894f;
      --wood-b: #ae6f3a;
      --wood-c: #8a5128;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 10% 10%, rgba(255, 236, 201, 0.52), transparent 38%),
        radial-gradient(circle at 88% 20%, rgba(161, 110, 71, 0.25), transparent 40%),
        linear-gradient(155deg, #f1e7d5 0%, var(--bg) 45%, #dcc8ad 100%);
      color: var(--text);
      font-family: "Quicksand", "Segoe UI", sans-serif;
      padding: 20px;
    }

    .hidden {
      display: none !important;
    }

    .game {
      width: min(96vw, 560px);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.8), rgba(255, 249, 238, 0.92)),
        var(--panel);
      border: 3px solid var(--line);
      border-radius: 20px;
      padding: 24px;
      box-shadow:
        0 18px 38px rgba(56, 34, 20, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      animation: card-rise 220ms ease-out;
    }

    .menu-actions {
      display: grid;
      gap: 12px;
      max-width: 260px;
      margin: 8px auto 0;
    }

    .menu-btn {
      border: 2px solid var(--line);
      background: linear-gradient(180deg, #fffaf2 0%, #f6e8d2 100%);
      color: var(--text);
      border-radius: 12px;
      font-weight: 800;
      font-size: 1.05rem;
      height: 52px;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: transform 140ms ease, box-shadow 140ms ease;
    }

    .menu-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(72, 43, 24, 0.2);
    }

    .shop-note {
      margin: 12px 0 16px;
      text-align: center;
      font-weight: 700;
    }

    .shop-wallet {
      margin: 0 0 10px;
      text-align: center;
      font-weight: 800;
      font-size: 0.9rem;
    }

    .shop-grid {
      display: grid;
      gap: 10px;
      margin: 0 0 14px;
    }

    .shop-item {
      border: 2px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      padding: 10px;
    }

    .shop-item-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      align-items: center;
    }

    .shop-item-name {
      font-weight: 800;
      font-size: 1rem;
    }

    .shop-item-price {
      font-weight: 800;
      font-size: 0.86rem;
      opacity: 0.9;
    }

    .shop-item-desc {
      margin: 0 0 8px;
      font-size: 0.86rem;
      font-weight: 700;
      opacity: 0.86;
    }

    .shop-item button {
      width: 100%;
    }

    .shop-item button[disabled] {
      opacity: 0.72;
      cursor: default;
      transform: none;
      box-shadow: 0 2px 0 rgba(75, 49, 35, 0.2);
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      letter-spacing: 1.1px;
      font-size: clamp(1.8rem, 4.5vw, 2.3rem);
      color: #4b2f1f;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
    }

    .wallet {
      margin: 0 0 12px;
      text-align: center;
      font-weight: 800;
      font-size: 0.98rem;
      background: rgba(255, 250, 242, 0.78);
      border: 2px dashed rgba(75, 49, 35, 0.5);
      border-radius: 10px;
      padding: 7px 10px;
    }

    .profile {
      border: 2px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      padding: 10px;
      margin: 0 0 12px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .profile-label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .profile-row {
      display: flex;
      gap: 8px;
    }

    .username-input {
      flex: 1;
      border: 2px solid var(--line);
      border-radius: 10px;
      height: 40px;
      padding: 0 10px;
      font-weight: 700;
      font-family: inherit;
      background: #fff;
    }

    .profile-help,
    .profile-stats {
      margin: 8px 0 0;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0.85;
    }

    .admin {
      border: 2px dashed var(--line);
      border-radius: 12px;
      background: #fffaf0;
      padding: 10px;
      margin: 0 0 12px;
    }

    .admin-title {
      margin: 0 0 8px;
      text-align: center;
      font-weight: 800;
      font-size: 0.95rem;
    }

    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .admin-note {
      margin: 8px 0 0;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 700;
      opacity: 0.8;
    }

    .setup {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .mode,
    .difficulty,
    .start,
    .reset {
      border: 2px solid var(--line);
      background: linear-gradient(180deg, #fffaf2 0%, #f0dec2 100%);
      color: var(--text);
      border-radius: 10px;
      font-weight: 700;
      height: 40px;
      box-shadow: 0 2px 0 rgba(75, 49, 35, 0.28);
    }

    .mode,
    .difficulty {
      flex: 1;
      padding: 0 10px;
      cursor: pointer;
    }

    .start,
    .reset {
      padding: 0 12px;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .start:hover,
    .reset:hover,
    .host:hover,
    .join:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 10px rgba(75, 49, 35, 0.2);
    }

    .status {
      margin: 0 0 16px;
      text-align: center;
      font-weight: 700;
      min-height: 1.4em;
    }

    .score-effect {
      margin: -8px 0 14px;
      text-align: center;
      min-height: 1.35em;
      font-weight: 900;
      letter-spacing: 0.8px;
      opacity: 0;
      transform: translateY(8px) scale(0.95);
      pointer-events: none;
    }

    .score-effect.active {
      animation: score-pop 850ms cubic-bezier(0.22, 0.86, 0.31, 1.1) forwards;
    }

    .score-effect.score-classic {
      color: #4b2f1f;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
    }

    .score-effect.score-ember {
      color: #9a2a00;
      text-shadow: 0 0 12px rgba(255, 126, 70, 0.6);
    }

    .score-effect.score-aurora {
      color: #265c9a;
      text-shadow: 0 0 14px rgba(119, 169, 255, 0.72);
    }

    .score-effect.score-meteor {
      color: #7a4d00;
      text-shadow: 0 0 14px rgba(255, 206, 89, 0.85);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
      padding: 12px;
      border: 4px solid #6d4326;
      border-radius: 14px;
      background:
        repeating-linear-gradient(
          8deg,
          rgba(78, 45, 24, 0.2) 0 2px,
          rgba(78, 45, 24, 0.06) 2px 5px,
          rgba(78, 45, 24, 0.16) 5px 8px
        ),
        linear-gradient(145deg, var(--wood-a) 0%, var(--wood-b) 52%, var(--wood-c) 100%);
      box-shadow:
        inset 0 2px 0 rgba(255, 214, 158, 0.35),
        inset 0 -2px 0 rgba(66, 37, 21, 0.35),
        0 8px 18px rgba(73, 44, 25, 0.26);
    }

    .cell {
      appearance: none;
      border: 2px solid #5f3a21;
      background:
        radial-gradient(circle at 24% 18%, rgba(255, 255, 255, 0.95), rgba(251, 244, 229, 0.94));
      border-radius: 10px;
      width: 100%;
      aspect-ratio: 1 / 1;
      font-size: clamp(2.5rem, 8vw, 3.7rem);
      font-weight: 800;
      cursor: pointer;
      color: var(--text);
      transition: transform 120ms ease, background 120ms ease, box-shadow 120ms ease;
      position: relative;
      touch-action: manipulation;
      box-shadow: 0 3px 0 rgba(95, 58, 33, 0.26);
    }

    .cell:hover:enabled {
      transform: translateY(-1px);
      background: radial-gradient(circle at 24% 18%, #ffffff, #f8f0e2);
      box-shadow: 0 6px 12px rgba(95, 58, 33, 0.26);
    }

    .cell:disabled {
      cursor: default;
    }

    .cell:focus-visible {
      outline: none;
    }

    .cell.selected {
      box-shadow:
        inset 0 0 0 3px rgba(66, 35, 15, 0.35),
        0 5px 12px rgba(95, 58, 33, 0.28);
      z-index: 1;
    }

    .cell.x {
      color: var(--x);
    }

    .cell.o {
      color: var(--o);
    }

    .winner {
      background: #dcf5df;
      border-color: var(--accent);
    }

    .board.effect-classic {
      box-shadow:
        0 0 0 2px rgba(255, 236, 168, 0.45),
        0 0 18px rgba(255, 221, 120, 0.5),
        inset 0 2px 0 rgba(255, 214, 158, 0.35),
        inset 0 -2px 0 rgba(66, 37, 21, 0.35),
        0 8px 18px rgba(73, 44, 25, 0.26);
      animation: effect-classic 750ms ease-out;
    }

    .board.effect-ember {
      box-shadow:
        0 0 0 2px rgba(255, 169, 76, 0.45),
        0 0 22px rgba(255, 124, 54, 0.6),
        inset 0 2px 0 rgba(255, 214, 158, 0.35),
        inset 0 -2px 0 rgba(66, 37, 21, 0.35),
        0 8px 18px rgba(73, 44, 25, 0.26);
      animation: effect-ember 850ms ease-out;
    }

    .board.effect-aurora {
      box-shadow:
        0 0 0 2px rgba(96, 219, 255, 0.5),
        0 0 30px rgba(129, 92, 255, 0.44),
        inset 0 2px 0 rgba(255, 214, 158, 0.35),
        inset 0 -2px 0 rgba(66, 37, 21, 0.35),
        0 8px 18px rgba(73, 44, 25, 0.26);
      animation: effect-aurora 900ms ease-out;
    }

    .board.effect-meteor {
      box-shadow:
        0 0 0 2px rgba(255, 229, 104, 0.5),
        0 0 34px rgba(255, 177, 62, 0.62),
        inset 0 2px 0 rgba(255, 214, 158, 0.35),
        inset 0 -2px 0 rgba(66, 37, 21, 0.35),
        0 8px 18px rgba(73, 44, 25, 0.26);
      animation: effect-meteor 950ms cubic-bezier(0.2, 0.74, 0.2, 1.2);
    }

    .win-particle {
      position: absolute;
      left: var(--x, 50%);
      top: var(--y, 50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--c, #fff);
      pointer-events: none;
      opacity: 0.95;
      transform: translate(-50%, -50%);
      animation: particle-burst 900ms ease-out forwards;
      z-index: 5;
    }

    .ember-spark {
      position: absolute;
      left: var(--x, 50%);
      bottom: -6px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--c, #ffb566);
      opacity: 0.95;
      pointer-events: none;
      animation: ember-rise 900ms ease-out forwards;
      z-index: 4;
    }

    .aurora-ribbon {
      position: absolute;
      left: -15%;
      top: var(--y, 25%);
      width: 130%;
      height: 10px;
      border-radius: 999px;
      opacity: 0.78;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, var(--c, #89f5ff), transparent);
      filter: blur(1px);
      animation: aurora-sweep 900ms ease-out forwards;
      z-index: 4;
    }

    .meteor {
      position: absolute;
      left: var(--x, 50%);
      top: -26px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff9cf, var(--c, #ffd35e));
      box-shadow: 0 0 18px rgba(255, 185, 70, 0.68);
      pointer-events: none;
      transform: translateX(-50%) rotate(25deg);
      animation: meteor-fall 820ms cubic-bezier(0.2, 0.72, 0.22, 1) forwards;
      animation-delay: var(--delay, 0ms);
      z-index: 6;
    }

    .meteor::after {
      content: "";
      position: absolute;
      right: 100%;
      top: 50%;
      width: 70px;
      height: 3px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, rgba(255, 221, 132, 0.7), transparent);
      border-radius: 999px;
      filter: blur(0.4px);
    }

    .fall {
      animation: fall-away 900ms cubic-bezier(0.25, 0.8, 0.2, 1) forwards;
      animation-delay: var(--delay, 0ms);
      pointer-events: none;
    }

    @keyframes fall-away {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(190px) rotate(var(--spin, 60deg));
        opacity: 0;
      }
    }

    @keyframes effect-classic {
      0% { transform: scale(1); }
      45% { transform: scale(1.014); }
      100% { transform: scale(1); }
    }

    @keyframes effect-ember {
      0% { transform: scale(1); }
      35% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    @keyframes effect-aurora {
      0% { filter: hue-rotate(0deg); transform: scale(1); }
      50% { filter: hue-rotate(40deg); transform: scale(1.015); }
      100% { filter: hue-rotate(0deg); transform: scale(1); }
    }

    @keyframes effect-meteor {
      0% { transform: scale(1); }
      30% { transform: scale(1.028); }
      100% { transform: scale(1); }
    }

    @keyframes particle-burst {
      0% {
        transform: translate(-50%, -50%) scale(0.2);
        opacity: 0.95;
      }
      100% {
        transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, -80px))) scale(0.1);
        opacity: 0;
      }
    }

    @keyframes ember-rise {
      0% {
        transform: translateY(0) scale(0.5);
        opacity: 0.95;
      }
      100% {
        transform: translateY(calc(-70px - var(--lift, 0px))) scale(0.15);
        opacity: 0;
      }
    }

    @keyframes aurora-sweep {
      0% {
        transform: translateX(-35%) scaleX(0.75);
        opacity: 0;
      }
      25% {
        opacity: 0.82;
      }
      100% {
        transform: translateX(22%) scaleX(1.04);
        opacity: 0;
      }
    }

    @keyframes meteor-fall {
      0% {
        transform: translate(-50%, -8px) rotate(25deg) scale(0.85);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      100% {
        transform: translate(calc(-50% + var(--dx, 0px)), 340px) rotate(25deg) scale(0.2);
        opacity: 0;
      }
    }

    @keyframes score-pop {
      0% {
        opacity: 0;
        transform: translateY(10px) scale(0.85);
      }
      24% {
        opacity: 1;
        transform: translateY(-4px) scale(1.08);
      }
      75% {
        opacity: 1;
        transform: translateY(-2px) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-14px) scale(0.95);
      }
    }

    .controls {
      display: flex;
      justify-content: center;
    }

    .online {
      display: none;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin: 0 0 12px;
    }

    .online.active {
      display: grid;
    }

    .room-code,
    .host,
    .join {
      border: 2px solid var(--line);
      background: #fffaf1;
      color: var(--text);
      border-radius: 10px;
      font-weight: 700;
      height: 40px;
      padding: 0 10px;
    }

    .host,
    .join {
      cursor: pointer;
      padding: 0 12px;
    }

    .connection {
      margin: 0 0 12px;
      text-align: center;
      font-size: 0.95rem;
      min-height: 1.4em;
    }

    @keyframes card-rise {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 700px) {
      body {
        padding: 12px;
      }

      .game {
        width: min(98vw, 560px);
        padding: 16px;
      }

      .setup,
      .controls {
        gap: 10px;
      }

      .difficulty,
      .start,
      .reset,
      .mode,
      .room-code,
      .host,
      .join {
        height: 48px;
        font-size: 1rem;
      }

      .board {
        gap: 8px;
      }

      .online {
        grid-template-columns: 1fr;
      }
    }

    @media (hover: none) and (pointer: coarse) {
      .cell:hover:enabled {
        transform: none;
        background: radial-gradient(circle at 24% 18%, rgba(255, 255, 255, 0.95), rgba(251, 244, 229, 0.94));
      }
    }
  </style>
</head>
<body>
  <section class="game" id="menuScreen" aria-label="Main menu">
    <h1>Alons Tic Tac</h1>
    <p class="wallet" aria-live="polite">Losun: <span id="losunValue">0</span></p>
    <div class="menu-actions">
      <button id="playMenuBtn" class="menu-btn">Play</button>
      <button id="shopMenuBtn" class="menu-btn">Shop</button>
      <button id="statsMenuBtn" class="menu-btn">Stats</button>
    </div>
  </section>

  <section class="game hidden" id="shopScreen" aria-label="Shop screen">
    <h1>Shop</h1>
    <p class="shop-wallet">Losun Balance: <span id="shopLosunValue">0</span></p>
    <p class="shop-note">Buy and equip win animations for AI + Online 1v1 wins.</p>
    <div id="shopItems" class="shop-grid" aria-label="Win animation items"></div>
    <div class="controls">
      <button id="shopBackBtn" class="start">Back</button>
    </div>
  </section>

  <section class="game hidden" id="statsScreen" aria-label="Stats screen">
    <h1 id="statsTitle">Stats</h1>
    <div class="profile" aria-label="Player profile">
      <label for="usernameInput" class="profile-label">Username</label>
      <div class="profile-row">
        <input id="usernameInput" class="username-input" type="text" maxlength="16" placeholder="Enter username" />
        <button id="saveProfileBtn" class="start">Save</button>
      </div>
      <p class="profile-help">Saved on this device. No email required.</p>
      <p class="profile-stats">
        Online 1v1 only: Games <span id="gamesCount">0</span> | Wins <span id="winsCount">0</span> | Losses <span id="lossesCount">0</span> | Draws <span id="drawsCount">0</span>
      </p>
    </div>
    <div class="admin hidden" id="adminPanel" aria-label="Owner admin panel">
      <p class="admin-title">Owner Admin</p>
      <div class="profile-row">
        <input id="adminPassInput" class="username-input" type="password" placeholder="Owner passcode" />
        <button id="adminUnlockBtn" class="start">Unlock</button>
      </div>
      <div id="adminActions" class="admin-actions hidden">
        <button id="adminAddLosunBtn" class="start">+1000 Losun</button>
        <button id="adminResetStatsBtn" class="reset">Reset Stats</button>
        <button id="adminResetAllBtn" class="reset">Reset Stats + Losun</button>
      </div>
      <p class="admin-note">Resets apply to this browser/device only.</p>
    </div>
    <div class="controls">
      <button id="statsBackBtn" class="start">Back</button>
    </div>
  </section>

  <main class="game hidden" id="boardScreen" aria-label="Tic-Tac-Toe game">
    <h1>Alons Tic Tac</h1>

    <div class="setup">
      <select id="mode" class="mode" aria-label="Game mode">
        <option value="ai">VS AI</option>
        <option value="online">Online 1v1</option>
      </select>
      <select id="difficulty" class="difficulty" aria-label="AI difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button id="startBtn" class="start">Start</button>
    </div>

    <div class="online" id="onlineControls">
      <input id="roomCode" class="room-code" type="text" placeholder="Room code" aria-label="Room code" />
      <button id="hostBtn" class="host">Host</button>
      <button id="joinBtn" class="join">Join</button>
    </div>

    <p class="connection" id="connectionText" aria-live="polite"></p>
    <p class="status" id="status" aria-live="polite"></p>
    <p class="score-effect" id="scoreEffect" aria-live="polite"></p>

    <section class="board" aria-label="Game board">
      <button class="cell" data-index="0" aria-label="Cell 1"></button>
      <button class="cell" data-index="1" aria-label="Cell 2"></button>
      <button class="cell" data-index="2" aria-label="Cell 3"></button>
      <button class="cell" data-index="3" aria-label="Cell 4"></button>
      <button class="cell" data-index="4" aria-label="Cell 5"></button>
      <button class="cell" data-index="5" aria-label="Cell 6"></button>
      <button class="cell" data-index="6" aria-label="Cell 7"></button>
      <button class="cell" data-index="7" aria-label="Cell 8"></button>
      <button class="cell" data-index="8" aria-label="Cell 9"></button>
    </section>

    <div class="controls">
      <button class="reset" id="resetBtn">New Game</button>
      <button class="start" id="menuBtn">Menu</button>
    </div>
  </main>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const cells = Array.from(document.querySelectorAll('.cell'));
    const statusText = document.getElementById('status');
    const scoreEffectText = document.getElementById('scoreEffect');
    const resetBtn = document.getElementById('resetBtn');
    const startBtn = document.getElementById('startBtn');
    const difficultySelect = document.getElementById('difficulty');
    const modeSelect = document.getElementById('mode');
    const onlineControls = document.getElementById('onlineControls');
    const roomCodeInput = document.getElementById('roomCode');

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          return null;
        }
        audioCtx = new AudioContextClass({ latencyHint: 'interactive' });
      }
      return audioCtx;
    }

    function unlockAudio() {
      const ctx = getAudioContext();
      if (!ctx || audioUnlocked) {
        return;
      }

      const finalizeUnlock = () => {
        const buffer = ctx.createBuffer(1, 1, 22050);
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(ctx.destination);
        source.start(0);
        audioUnlocked = true;
      };

      if (ctx.state === 'suspended') {
        ctx.resume().then(finalizeUnlock).catch(() => {});
      } else {
        finalizeUnlock();
      }
    }

    function primeAudio() {
      unlockAudio();
    }

    function playTone(frequency, duration, type, volume, when = 0) {
      const ctx = getAudioContext();
      if (!ctx) {
        return;
      }

      const start = ctx.currentTime + when;
      const end = start + duration;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(frequency, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, volume), start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, end);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(end);
    }

    function playLoseHonk() {

    function getEmptyIndices(currentBoard) {
      return currentBoard
        .map((value, index) => (value === '' ? index : -1))
        .filter((index) => index !== -1);
    }

    function winnerForBoard(currentBoard) {
      for (const [a, b, c] of wins) {
        if (currentBoard[a] && currentBoard[a] === currentBoard[b] && currentBoard[b] === currentBoard[c]) {
          return currentBoard[a];
        }
      }
      return getEmptyIndices(currentBoard).length === 0 ? 'draw' : null;
    }

    function checkWinner() {
      for (const combo of wins) {
        const [a, b, c] = combo;
        if (board[a] && board[a] === board[b] && board[b] === board[c]) {
          combo.forEach((index) => cells[index].classList.add('winner'));
          return board[a];
        }
      }

      if (!board.includes('')) {
        return 'draw';
      }
      return null;
    }

    function setBoardDisabled(disabled) {

    function pickRandomMove() {
      const empty = getEmptyIndices(board);
      return empty[Math.floor(Math.random() * empty.length)];
    }

    function minimax(currentBoard, isMaximizing, depth) {
      const result = winnerForBoard(currentBoard);

      if (result === 'O') {
        return { score: 10 - depth };
      }
      if (result === 'X') {
        return { score: depth - 10 };
      }
      if (result === 'draw') {
        return { score: 0 };
      }

      const empty = getEmptyIndices(currentBoard);
      let bestMove = null;

      if (isMaximizing) {
        let bestScore = -Infinity;
        for (const idx of empty) {
          currentBoard[idx] = 'O';
          const outcome = minimax(currentBoard, false, depth + 1);
          currentBoard[idx] = '';

          if (outcome.score > bestScore) {
            bestScore = outcome.score;
            bestMove = idx;
          }
        }
        return { score: bestScore, index: bestMove };
      }

      let bestScore = Infinity;
      for (const idx of empty) {
        currentBoard[idx] = 'X';
        const outcome = minimax(currentBoard, true, depth + 1);
        currentBoard[idx] = '';

        if (outcome.score < bestScore) {
          bestScore = outcome.score;
          bestMove = idx;
        }
      }
      return { score: bestScore, index: bestMove };
    }

    function pickAiMove() {
      if (difficulty === 'easy') {
        return pickRandomMove();
      }

      if (difficulty === 'medium') {
        if (Math.random() < 0.6) {
          return minimax([...board], true, 0).index;
        }
        return pickRandomMove();
      }

      return minimax([...board], true, 0).index;
    }

    function isHumanTurn() {
      if (mode === 'online') {
        return onlineConnected && player === myMark;
      }
      return player === 'X';
    }

    function updateTurnStatus() {
      if (mode === 'online') {
        if (!onlineConnected) {
          updateStatus('Create or join a room to start online 1v1.');
          return;
        }
        if (gameOver) {
          return;
        }
        updateStatus(isHumanTurn() ? `Your turn (${myMark})` : `Opponent's turn (${player})`);
        return;
      }

      if (gameOver) {
        return;
      }
      updateStatus(player === 'X' ? `Difficulty: ${difficulty}. Your turn (X)` : 'AI is thinking...');
    }

    function sendOnlineMessage(payload) {
      if (mode === 'online' && conn && conn.open) {
        conn.send(payload);
      }

    function animatePiecesFallAndRestart() {
      animatingReset = true;
      const fallingCells = [...cells];
      const delayStep = 65;
      const fallDuration = 900;

      fallingCells.forEach((cell) => {
        cell.classList.remove('fall');
      });

      document.body.offsetHeight;

      fallingCells.forEach((cell, i) => {
        cell.style.setProperty('--delay', `${i * delayStep}ms`);
        cell.style.setProperty('--spin', `${-110 + Math.random() * 220}deg`);
        cell.classList.add('fall');
      });

      const maxDelay = Math.max(0, (fallingCells.length - 1) * delayStep);
      const restartAfter = maxDelay + fallDuration + 120;

      setTimeout(() => {
        resetBoard();
        player = 'X';
        updateTurnStatus();
        if (mode === 'online') {
          setBoardDisabled(!isHumanTurn());
        } else {
          setBoardDisabled(false);
        }
      }, restartAfter);
    }

    function endGame(result) {
      gameOver = true;
      setBoardDisabled(true);

      if (result === 'draw') {
        if (mode === 'online') {
          recordMatchResult(result, false);
        }
        updateStatus('Draw! New round starts now.');
        animatePiecesFallAndRestart();
        return;
      }

      const won = mode === 'online' ? result === myMark : result === 'X';
      if (mode === 'online') {
        recordMatchResult(result, won);
      }
      if (won) {
        triggerWinScoreEffect();
        triggerEquippedWinAnimation();
        if (mode === 'online') {
          addLosun(10);
          updateStatus('You win! +10 Losun');
        } else {
          updateStatus('You win! No Losun in VS AI.');
        }
        playWinCheer();
      } else {
        updateStatus(mode === 'online' ? 'You lose!' : 'AI wins!');
        playLoseHonk();
      }

      animatePiecesFallAndRestart();
    }

    function applyMove(index, mark, fromRemote = false) {
      if (board[index] || mark !== player || gameOver || animatingReset) {
        return false;
      }

      board[index] = mark;
      const cell = cells[index];
      cell.textContent = mark;
      cell.classList.add(mark.toLowerCase());
      cell.disabled = true;

      const result = checkWinner();
      if (result) {
        endGame(result);
      } else {
        player = mark === 'X' ? 'O' : 'X';
        updateTurnStatus();
      }

      if (mode === 'online' && !fromRemote) {
        sendOnlineMessage({ type: 'move', index, mark });
      }

      if (!gameOver) {
        if (mode === 'ai' && player === 'O') {
          setBoardDisabled(true);
          aiMoveTimer = setTimeout(aiMove, 380);
        } else {
          setBoardDisabled(!isHumanTurn());
        }
      }

      return true;
    }

    function aiMove() {
      if (!gameStarted || gameOver || animatingReset || mode !== 'ai' || player !== 'O') {
        return;
      }

      const move = pickAiMove();
      if (typeof move === 'number') {
        applyMove(move, 'O');
      }
    }

    function onCellClick(event) {
      if (!gameStarted || gameOver || animatingReset || !isHumanTurn()) {
        return;
      }
      primeAudio();

      const cell = event.currentTarget;
      const index = Number(cell.dataset.index);
      setSelectedIndex(index);

      if (mode === 'online') {
        applyMove(index, myMark);
      } else {
        applyMove(index, 'X');
      }
    }

    function clearPendingAiMove() {
      if (aiMoveTimer) {
        clearTimeout(aiMoveTimer);
        aiMoveTimer = null;
      }
    }

    function resetBoard() {
      clearScoreEffect();
      clearBoardWinEffects();
      clearPendingAiMove();
      board = Array(9).fill('');
      player = 'X';
      gameOver = false;
      animatingReset = false;

      cells.forEach((cell) => {
        cell.textContent = '';
        cell.disabled = !gameStarted;
        cell.classList.remove('x', 'o', 'winner', 'fall');
        cell.style.removeProperty('--delay');
        cell.style.removeProperty('--spin');
      });

      const firstEmpty = findFirstEmptyCell();
      setSelectedIndex(firstEmpty >= 0 ? firstEmpty : 0);
    }

    function disconnectOnline() {
      if (conn) {
        try {
          conn.close();
        } catch (err) {}
        conn = null;
      }
      if (peer) {
        try {
          peer.destroy();
        } catch (err) {}
        peer = null;
      }
      onlineConnected = false;
      isHost = false;
      updateConnection('');
    }

    function setupConnHandlers(newConn) {
      conn = newConn;

      conn.on('open', () => {
        onlineConnected = true;
        gameStarted = true;
        resetBoard();
        updateConnection(`Connected. You are ${myMark}.`);
        updateTurnStatus();
        setBoardDisabled(!isHumanTurn());
      });

      conn.on('data', (msg) => {
        if (!msg || typeof msg !== 'object') {
          return;
        }

        if (msg.type === 'move' && typeof msg.index === 'number' && (msg.mark === 'X' || msg.mark === 'O')) {
          applyMove(msg.index, msg.mark, true);
        } else if (msg.type === 'reset') {
          resetBoard();
          player = 'X';
          updateTurnStatus();
          setBoardDisabled(!isHumanTurn());
        }
      });

      conn.on('close', () => {
        onlineConnected = false;
        gameStarted = false;
        setBoardDisabled(true);
        updateConnection('Disconnected. Host or join again.');
        updateStatus('Online session ended.');
      });
    }

    function hostOnlineGame() {
      primeAudio();
      mode = 'online';
      modeSelect.value = 'online';
      updateModeUi();

      disconnectOnline();
      isHost = true;
      myMark = 'X';
      updateConnection('Creating room...');

      if (typeof Peer === 'undefined') {
        updateConnection('Online service unavailable right now.');
        return;
      }

      const roomCode = generateRoomCode();
      peer = new Peer(roomCodeToPeerId(roomCode));
      peer.on('open', () => {
        roomCodeInput.value = roomCode;
        updateConnection('Room ready. Share this code and wait for opponent.');
      });
      peer.on('connection', (incoming) => {
        if (conn && conn.open) {
          incoming.close();
          return;
        }
        setupConnHandlers(incoming);
      });
      peer.on('error', (err) => {
        if (err && err.type === 'unavailable-id') {
          updateConnection('Room code busy. Tap Host again for a new 4-digit code.');
          return;
        }
        updateConnection('Could not host room. Try again.');
      });
    }

    function joinOnlineGame() {
      primeAudio();
      const roomCode = parseRoomCodeInput(roomCodeInput.value);
      if (!roomCode) {
        updateConnection('Enter a valid 4-digit room code.');
        return;
      }

      mode = 'online';
      modeSelect.value = 'online';
      updateModeUi();

      disconnectOnline();
      isHost = false;
      myMark = 'O';
      updateConnection('Joining room...');

      if (typeof Peer === 'undefined') {
        updateConnection('Online service unavailable right now.');
        return;
      }

      peer = new Peer();
      peer.on('open', () => {
        const outgoing = peer.connect(roomCodeToPeerId(roomCode), { reliable: true });
        setupConnHandlers(outgoing);
      });
      peer.on('error', () => {
        updateConnection('Could not join room. Check code and try again.');
      });
    }

    function startGame() {
      primeAudio();
      if (mode !== 'ai') {
        updateStatus('Use Host/Join for online mode.');
        return;
      }

      difficulty = difficultySelect.value;
      gameStarted = true;
      resetBoard();
      player = 'X';
      updateTurnStatus();
      setBoardDisabled(false);
    }

    function manualNewGame() {
      if (!gameStarted) {
        updateStatus(mode === 'ai' ? 'Choose difficulty and press Start.' : 'Host or join a room first.');
        return;
      }
      if (animatingReset) {
        return;
      }

      resetBoard();
      player = 'X';
      updateTurnStatus();

      if (mode === 'online') {
        sendOnlineMessage({ type: 'reset' });
        setBoardDisabled(!isHumanTurn());
      } else {
        setBoardDisabled(false);
      }
    }

    function updateModeUi() {
      mode = modeSelect.value;
      const online = mode === 'online';

      onlineControls.classList.toggle('active', online);
      difficultySelect.disabled = online;
      startBtn.disabled = online;

      if (online) {
        updateStatus('Create or join a room to start online 1v1.');
        setBoardDisabled(true);
      } else {
        disconnectOnline();
        gameStarted = false;
        resetBoard();
        updateConnection('');
        updateStatus('Choose difficulty and press Start.');
        setBoardDisabled(true);
      }
    }

    function moveSelection(deltaRow, deltaCol) {
      const row = Math.floor(selectedIndex / 3);
      const col = selectedIndex % 3;
      const nextRow = Math.max(0, Math.min(2, row + deltaRow));
      const nextCol = Math.max(0, Math.min(2, col + deltaCol));
      setSelectedIndex(nextRow * 3 + nextCol);
    }

    function activateSelectedCell() {
      if (!gameStarted || gameOver || animatingReset || !isHumanTurn()) {
        return;
      }
      const cell = cells[selectedIndex];
      if (!cell || cell.disabled) {
        return;
      }
      cell.click();
    }

    function handleKeyboard(event) {
      if (!isBoardScreenActive()) {
        return;
      }

      if (event.repeat) {
        return;
      }

      if (event.key === 'ArrowUp') {
        event.preventDefault();
        moveSelection(-1, 0);
      } else if (event.key === 'ArrowDown') {
        event.preventDefault();
        moveSelection(1, 0);
      } else if (event.key === 'ArrowLeft') {
        event.preventDefault();
        moveSelection(0, -1);
      } else if (event.key === 'ArrowRight') {
        event.preventDefault();
        moveSelection(0, 1);
      } else if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        activateSelectedCell();
      } else if (event.key.toLowerCase() === 's') {
        event.preventDefault();
        startGame();
      }
    }

    function pollGamepad() {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      const pad = pads && pads[0];
      const boardActive = isBoardScreenActive();

      if (pad) {
        const currentState = {
          up: Boolean(pad.buttons[12] && pad.buttons[12].pressed),
          down: Boolean(pad.buttons[13] && pad.buttons[13].pressed),
          left: Boolean(pad.buttons[14] && pad.buttons[14].pressed),
          right: Boolean(pad.buttons[15] && pad.buttons[15].pressed),
          select: Boolean(pad.buttons[0] && pad.buttons[0].pressed),
          start: Boolean(pad.buttons[9] && pad.buttons[9].pressed)
        };

        if (boardActive && currentState.up && !previousPadState.up) {
          moveSelection(-1, 0);
        }
        if (boardActive && currentState.down && !previousPadState.down) {
          moveSelection(1, 0);
        }
        if (boardActive && currentState.left && !previousPadState.left) {
          moveSelection(0, -1);
        }
        if (boardActive && currentState.right && !previousPadState.right) {
          moveSelection(0, 1);
        }
        if (boardActive && currentState.select && !previousPadState.select) {
          activateSelectedCell();
        }
        if (boardActive && currentState.start && !previousPadState.start) {
          startGame();
        }

        previousPadState = currentState;
      }

      gamepadFrameId = requestAnimationFrame(pollGamepad);
    }

    cells.forEach((cell) => {
      cell.addEventListener('click', onCellClick);
    });

    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', manualNewGame);
    hostBtn.addEventListener('click', hostOnlineGame);
    joinBtn.addEventListener('click', joinOnlineGame);
    playMenuBtn.addEventListener('click', openBoardScreen);
    shopMenuBtn.addEventListener('click', openShopScreen);
    statsMenuBtn.addEventListener('click', openStatsScreen);
    shopBackBtn.addEventListener('click', openMenuScreen);
    statsBackBtn.addEventListener('click', openMenuScreen);
    menuBtn.addEventListener('click', openMenuScreen);
    shopItems.addEventListener('click', handleShopClick);
    statsTitle.addEventListener('click', handleStatsTitleTap);
    saveProfileBtn.addEventListener('click', saveUsernameFromInput);
    adminUnlockBtn.addEventListener('click', unlockAdmin);
    adminAddLosunBtn.addEventListener('click', adminAddLosun);
    adminResetStatsBtn.addEventListener('click', adminResetStats);
    adminResetAllBtn.addEventListener('click', adminResetAllProgress);
    usernameInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        saveUsernameFromInput();
      }
    });

    difficultySelect.addEventListener('change', () => {
      difficulty = difficultySelect.value;
      if (mode === 'ai' && gameStarted) {
        resetBoard();
        updateTurnStatus();
        setBoardDisabled(false);
      }
    });

    modeSelect.addEventListener('change', updateModeUi);
    document.addEventListener('keydown', handleKeyboard);
    document.addEventListener('pointerdown', unlockAudio, { passive: true });
    document.addEventListener('touchstart', unlockAudio, { passive: true });

    updateConnection('');
    loadProfile();
    loadLosun();
    loadShopState();
    updateAdminUi();
    window.spendLosun = spendLosun;
    setActiveScreen('menu');
    updateModeUi();
    refreshSelectedCell();
    if (!gamepadFrameId) {
      gamepadFrameId = requestAnimationFrame(pollGamepad);
    }
  </script>
</body>
</html>
