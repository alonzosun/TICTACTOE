<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alons Tic Tac</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1ea;
      --panel: #fffaf0;
      --text: #1c1c1c;
      --x: #0d6e6e;
      --o: #d9480f;
      --line: #1c1c1c;
      --accent: #2f9e44;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at top left, #e7dcc5, var(--bg));
      color: var(--text);
      font-family: "Quicksand", "Segoe UI", sans-serif;
      padding: 20px;
    }

    .page {
      width: 100%;
      flex: 1;
      display: grid;
      place-items: center;
    }

    .game {
      width: min(96vw, 560px);
      background: var(--panel);
      border: 3px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.15);
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      letter-spacing: 1px;
    }

    .setup {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .mode,
    .difficulty,
    .start,
    .reset {
      border: 2px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 10px;
      font-weight: 700;
      height: 40px;
    }

    .mode,
    .difficulty {
      flex: 1;
      padding: 0 10px;
      cursor: pointer;
    }

    .start,
    .reset {
      padding: 0 12px;
      cursor: pointer;
    }

    .status {
      margin: 0 0 16px;
      text-align: center;
      font-weight: 700;
      min-height: 1.4em;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .cell {
      appearance: none;
      border: 2px solid var(--line);
      background: #fff;
      border-radius: 10px;
      width: 100%;
      aspect-ratio: 1 / 1;
      font-size: clamp(2.5rem, 8vw, 3.7rem);
      font-weight: 800;
      cursor: pointer;
      color: var(--text);
      transition: transform 120ms ease, background 120ms ease;
      position: relative;
      touch-action: manipulation;
    }

    .cell:hover:enabled {
      transform: translateY(-1px);
      background: #faf6ee;
    }

    .cell:disabled {
      cursor: default;
    }

    .cell:focus-visible {
      outline: none;
    }

    .cell.selected {
      box-shadow: inset 0 0 0 3px rgba(28, 28, 28, 0.25);
      z-index: 1;
    }

    .cell.x {
      color: var(--x);
    }

    .cell.o {
      color: var(--o);
    }

    .winner {
      background: #dcf5df;
      border-color: var(--accent);
    }

    .fall {
      animation: fall-away 900ms cubic-bezier(0.25, 0.8, 0.2, 1) forwards;
      animation-delay: var(--delay, 0ms);
      pointer-events: none;
    }

    @keyframes fall-away {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(190px) rotate(var(--spin, 60deg));
        opacity: 0;
      }
    }

    .controls {
      display: flex;
      justify-content: center;
    }

    .site-footer {
      width: 100%;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 700;
      color: rgba(28, 28, 28, 0.72);
      padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
    }

    .online {
      display: none;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin: 0 0 12px;
    }

    .online.active {
      display: grid;
    }

    .room-code,
    .host,
    .join {
      border: 2px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 10px;
      font-weight: 700;
      height: 40px;
      padding: 0 10px;
    }

    .host,
    .join {
      cursor: pointer;
      padding: 0 12px;
    }

    .connection {
      margin: 0 0 12px;
      text-align: center;
      font-size: 0.95rem;
      min-height: 1.4em;
    }

    @media (max-width: 700px) {
      body {
        padding: 12px 12px 8px;
      }

      .game {
        width: min(98vw, 560px);
        padding: 16px;
      }

      .setup,
      .controls {
        gap: 10px;
      }

      .difficulty,
      .start,
      .reset,
      .mode,
      .room-code,
      .host,
      .join {
        height: 48px;
        font-size: 1rem;
      }

      .board {
        gap: 8px;
      }

      .online {
        grid-template-columns: 1fr;
      }
    }

    @media (hover: none) and (pointer: coarse) {
      .cell:hover:enabled {
        transform: none;
        background: #fff;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="game" aria-label="Tic-Tac-Toe game">
    <h1>Alons Tic Tac</h1>

    <div class="setup">
      <select id="mode" class="mode" aria-label="Game mode">
        <option value="ai">VS AI</option>
        <option value="online">Online 1v1</option>
      </select>
      <select id="difficulty" class="difficulty" aria-label="AI difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button id="startBtn" class="start">Start</button>
    </div>

    <div class="online" id="onlineControls">
      <input id="roomCode" class="room-code" type="text" inputmode="numeric" maxlength="4" placeholder="4-digit code" aria-label="Room code" />
      <button id="hostBtn" class="host">Host</button>
      <button id="joinBtn" class="join">Join</button>
    </div>

    <p class="connection" id="connectionText" aria-live="polite"></p>
    <p class="status" id="status" aria-live="polite"></p>

    <section class="board" aria-label="Game board">
      <button class="cell" data-index="0" aria-label="Cell 1"></button>
      <button class="cell" data-index="1" aria-label="Cell 2"></button>
      <button class="cell" data-index="2" aria-label="Cell 3"></button>
      <button class="cell" data-index="3" aria-label="Cell 4"></button>
      <button class="cell" data-index="4" aria-label="Cell 5"></button>
      <button class="cell" data-index="5" aria-label="Cell 6"></button>
      <button class="cell" data-index="6" aria-label="Cell 7"></button>
      <button class="cell" data-index="7" aria-label="Cell 8"></button>
      <button class="cell" data-index="8" aria-label="Cell 9"></button>
    </section>

    <div class="controls">
      <button class="reset" id="resetBtn">New Game</button>
    </div>
    </main>
  </div>
  <footer class="site-footer">Version v1.1</footer>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const cells = Array.from(document.querySelectorAll('.cell'));
    const statusText = document.getElementById('status');
    const resetBtn = document.getElementById('resetBtn');
    const startBtn = document.getElementById('startBtn');
    const difficultySelect = document.getElementById('difficulty');
    const modeSelect = document.getElementById('mode');
    const onlineControls = document.getElementById('onlineControls');
    const roomCodeInput = document.getElementById('roomCode');
    const hostBtn = document.getElementById('hostBtn');
    const joinBtn = document.getElementById('joinBtn');
    const connectionText = document.getElementById('connectionText');

    const wins = [
      [0, 1, 2],
      [3, 4, 5],
      [6, 7, 8],
      [0, 3, 6],
      [1, 4, 7],
      [2, 5, 8],
      [0, 4, 8],
      [2, 4, 6]
    ];

    let board = Array(9).fill('');
    let player = 'X';
    let gameOver = false;
    let gameStarted = false;
    let difficulty = 'easy';
    let mode = 'ai';
    let animatingReset = false;
    let aiMoveTimer = null;
    let audioCtx = null;
    let audioUnlocked = false;
    let selectedIndex = 0;
    let gamepadFrameId = null;
    let previousPadState = { up: false, down: false, left: false, right: false, select: false, start: false };

    let peer = null;
    let conn = null;
    let onlineConnected = false;
    let isHost = false;
    let myMark = 'X';

    function updateStatus(message) {
      statusText.textContent = message;
    }

    function updateConnection(message) {
      connectionText.textContent = message;
    }

    function refreshSelectedCell() {
      cells.forEach((cell, index) => {
        cell.classList.toggle('selected', index === selectedIndex);
      });
    }

    function setSelectedIndex(index) {
      selectedIndex = Math.max(0, Math.min(8, index));
      refreshSelectedCell();
    }

    function findFirstEmptyCell() {
      return board.findIndex((mark) => mark === '');
    }

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          return null;
        }
        audioCtx = new AudioContextClass({ latencyHint: 'interactive' });
      }
      return audioCtx;
    }

    function unlockAudio() {
      const ctx = getAudioContext();
      if (!ctx || audioUnlocked) {
        return;
      }

      const finalizeUnlock = () => {
        const buffer = ctx.createBuffer(1, 1, 22050);
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(ctx.destination);
        source.start(0);
        audioUnlocked = true;
      };

      if (ctx.state === 'suspended') {
        ctx.resume().then(finalizeUnlock).catch(() => {});
      } else {
        finalizeUnlock();
      }
    }

    function primeAudio() {
      unlockAudio();
    }

    function playTone(frequency, duration, type, volume, when = 0) {
      const ctx = getAudioContext();
      if (!ctx) {
        return;
      }

      const start = ctx.currentTime + when;
      const end = start + duration;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(frequency, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, volume), start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, end);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(end);
    }

    function playLoseHonk() {
      playTone(190, 0.22, 'sawtooth', 0.16, 0);
      playTone(155, 0.3, 'square', 0.14, 0.16);
      playTone(120, 0.35, 'sawtooth', 0.12, 0.36);
    }

    function playWinCheer() {
      const notes = [440, 554, 659, 880, 988];
      notes.forEach((note, i) => {
        playTone(note, 0.16, 'triangle', 0.12, i * 0.1);
      });
    }

    function getEmptyIndices(currentBoard) {
      return currentBoard
        .map((value, index) => (value === '' ? index : -1))
        .filter((index) => index !== -1);
    }

    function winnerForBoard(currentBoard) {
      for (const [a, b, c] of wins) {
        if (currentBoard[a] && currentBoard[a] === currentBoard[b] && currentBoard[b] === currentBoard[c]) {
          return currentBoard[a];
        }
      }
      return getEmptyIndices(currentBoard).length === 0 ? 'draw' : null;
    }

    function checkWinner() {
      for (const combo of wins) {
        const [a, b, c] = combo;
        if (board[a] && board[a] === board[b] && board[b] === board[c]) {
          combo.forEach((index) => cells[index].classList.add('winner'));
          return board[a];
        }
      }

      if (!board.includes('')) {
        return 'draw';
      }
      return null;
    }

    function setBoardDisabled(disabled) {
      cells.forEach((cell) => {
        const idx = Number(cell.dataset.index);
        cell.disabled = disabled || board[idx] !== '';
      });
      refreshSelectedCell();
    }

    function pickRandomMove() {
      const empty = getEmptyIndices(board);
      return empty[Math.floor(Math.random() * empty.length)];
    }

    function minimax(currentBoard, isMaximizing, depth) {
      const result = winnerForBoard(currentBoard);

      if (result === 'O') {
        return { score: 10 - depth };
      }
      if (result === 'X') {
        return { score: depth - 10 };
      }
      if (result === 'draw') {
        return { score: 0 };
      }

      const empty = getEmptyIndices(currentBoard);
      let bestMove = null;

      if (isMaximizing) {
        let bestScore = -Infinity;
        for (const idx of empty) {
          currentBoard[idx] = 'O';
          const outcome = minimax(currentBoard, false, depth + 1);
          currentBoard[idx] = '';

          if (outcome.score > bestScore) {
            bestScore = outcome.score;
            bestMove = idx;
          }
        }
        return { score: bestScore, index: bestMove };
      }

      let bestScore = Infinity;
      for (const idx of empty) {
        currentBoard[idx] = 'X';
        const outcome = minimax(currentBoard, true, depth + 1);
        currentBoard[idx] = '';

        if (outcome.score < bestScore) {
          bestScore = outcome.score;
          bestMove = idx;
        }
      }
      return { score: bestScore, index: bestMove };
    }

    function pickAiMove() {
      if (difficulty === 'easy') {
        return pickRandomMove();
      }

      if (difficulty === 'medium') {
        if (Math.random() < 0.6) {
          return minimax([...board], true, 0).index;
        }
        return pickRandomMove();
      }

      return minimax([...board], true, 0).index;
    }

    function isHumanTurn() {
      if (mode === 'online') {
        return onlineConnected && player === myMark;
      }
      return player === 'X';
    }

    function updateTurnStatus() {
      if (mode === 'online') {
        if (!onlineConnected) {
          updateStatus('Create or join a room to start online 1v1.');
          return;
        }
        if (gameOver) {
          return;
        }
        updateStatus(isHumanTurn() ? `Your turn (${myMark})` : `Opponent's turn (${player})`);
        return;
      }

      if (gameOver) {
        return;
      }
      updateStatus(player === 'X' ? `Difficulty: ${difficulty}. Your turn (X)` : 'AI is thinking...');
    }

    function sendOnlineMessage(payload) {
      if (mode === 'online' && conn && conn.open) {
        conn.send(payload);
      }
    }

    function animatePiecesFallAndRestart() {
      animatingReset = true;
      const fallingCells = [...cells];
      const delayStep = 65;
      const fallDuration = 900;

      fallingCells.forEach((cell) => {
        cell.classList.remove('fall');
      });

      document.body.offsetHeight;

      fallingCells.forEach((cell, i) => {
        cell.style.setProperty('--delay', `${i * delayStep}ms`);
        cell.style.setProperty('--spin', `${-110 + Math.random() * 220}deg`);
        cell.classList.add('fall');
      });

      const maxDelay = Math.max(0, (fallingCells.length - 1) * delayStep);
      const restartAfter = maxDelay + fallDuration + 120;

      setTimeout(() => {
        resetBoard();
        player = 'X';
        updateTurnStatus();
        if (mode === 'online') {
          setBoardDisabled(!isHumanTurn());
        } else {
          setBoardDisabled(false);
        }
      }, restartAfter);
    }

    function endGame(result) {
      gameOver = true;
      setBoardDisabled(true);

      if (result === 'draw') {
        updateStatus('Draw! New round starts now.');
        animatePiecesFallAndRestart();
        return;
      }

      const won = mode === 'online' ? result === myMark : result === 'X';
      if (won) {
        updateStatus('You win!');
        playWinCheer();
      } else {
        updateStatus(mode === 'online' ? 'You lose!' : 'AI wins!');
        playLoseHonk();
      }

      animatePiecesFallAndRestart();
    }

    function applyMove(index, mark, fromRemote = false) {
      if (board[index] || mark !== player || gameOver || animatingReset) {
        return false;
      }

      board[index] = mark;
      const cell = cells[index];
      cell.textContent = mark;
      cell.classList.add(mark.toLowerCase());
      cell.disabled = true;

      const result = checkWinner();
      if (result) {
        endGame(result);
      } else {
        player = mark === 'X' ? 'O' : 'X';
        updateTurnStatus();
      }

      if (mode === 'online' && !fromRemote) {
        sendOnlineMessage({ type: 'move', index, mark });
      }

      if (!gameOver) {
        if (mode === 'ai' && player === 'O') {
          setBoardDisabled(true);
          aiMoveTimer = setTimeout(aiMove, 380);
        } else {
          setBoardDisabled(!isHumanTurn());
        }
      }

      return true;
    }

    function aiMove() {
      if (!gameStarted || gameOver || animatingReset || mode !== 'ai' || player !== 'O') {
        return;
      }

      const move = pickAiMove();
      if (typeof move === 'number') {
        applyMove(move, 'O');
      }
    }

    function onCellClick(event) {
      if (!gameStarted || gameOver || animatingReset || !isHumanTurn()) {
        return;
      }
      primeAudio();

      const cell = event.currentTarget;
      const index = Number(cell.dataset.index);
      setSelectedIndex(index);

      if (mode === 'online') {
        applyMove(index, myMark);
      } else {
        applyMove(index, 'X');
      }
    }

    function clearPendingAiMove() {
      if (aiMoveTimer) {
        clearTimeout(aiMoveTimer);
        aiMoveTimer = null;
      }
    }

    function resetBoard() {
      clearPendingAiMove();
      board = Array(9).fill('');
      player = 'X';
      gameOver = false;
      animatingReset = false;

      cells.forEach((cell) => {
        cell.textContent = '';
        cell.disabled = !gameStarted;
        cell.classList.remove('x', 'o', 'winner', 'fall');
        cell.style.removeProperty('--delay');
        cell.style.removeProperty('--spin');
      });

      const firstEmpty = findFirstEmptyCell();
      setSelectedIndex(firstEmpty >= 0 ? firstEmpty : 0);
    }

    function disconnectOnline() {
      if (conn) {
        try {
          conn.close();
        } catch (err) {}
        conn = null;
      }
      if (peer) {
        try {
          peer.destroy();
        } catch (err) {}
        peer = null;
      }
      onlineConnected = false;
      isHost = false;
      updateConnection('');
    }

    function setupConnHandlers(newConn) {
      conn = newConn;

      conn.on('open', () => {
        onlineConnected = true;
        gameStarted = true;
        resetBoard();
        updateConnection(`Connected. You are ${myMark}.`);
        updateTurnStatus();
        setBoardDisabled(!isHumanTurn());
      });

      conn.on('data', (msg) => {
        if (!msg || typeof msg !== 'object') {
          return;
        }

        if (msg.type === 'move' && typeof msg.index === 'number' && (msg.mark === 'X' || msg.mark === 'O')) {
          applyMove(msg.index, msg.mark, true);
        } else if (msg.type === 'reset') {
          resetBoard();
          player = 'X';
          updateTurnStatus();
          setBoardDisabled(!isHumanTurn());
        }
      });

      conn.on('close', () => {
        onlineConnected = false;
        gameStarted = false;
        setBoardDisabled(true);
        updateConnection('Disconnected. Host or join again.');
        updateStatus('Online session ended.');
      });
    }

    function hostOnlineGame() {
      primeAudio();
      mode = 'online';
      modeSelect.value = 'online';
      updateModeUi();

      disconnectOnline();
      isHost = true;
      myMark = 'X';
      updateConnection('Creating room...');

      if (typeof Peer === 'undefined') {
        updateConnection('Online service unavailable right now.');
        return;
      }

      const hostCode = String(Math.floor(Math.random() * 10000)).padStart(4, '0');
      roomCodeInput.value = hostCode;
      peer = new Peer(hostCode);
      peer.on('open', (id) => {
        roomCodeInput.value = id;
        updateConnection('Room ready. Share this 4-digit code and wait for opponent.');
      });
      peer.on('connection', (incoming) => {
        if (conn && conn.open) {
          incoming.close();
          return;
        }
        setupConnHandlers(incoming);
      });
      peer.on('error', () => {
        updateConnection('Could not host room. Try again.');
      });
    }

    function joinOnlineGame() {
      primeAudio();
      const roomCode = roomCodeInput.value.trim();
      if (!/^\d{4}$/.test(roomCode)) {
        updateConnection('Enter a valid 4-digit room code.');
        return;
      }

      mode = 'online';
      modeSelect.value = 'online';
      updateModeUi();

      disconnectOnline();
      isHost = false;
      myMark = 'O';
      updateConnection('Joining room...');

      if (typeof Peer === 'undefined') {
        updateConnection('Online service unavailable right now.');
        return;
      }

      peer = new Peer();
      peer.on('open', () => {
        const outgoing = peer.connect(roomCode, { reliable: true });
        setupConnHandlers(outgoing);
      });
      peer.on('error', () => {
        updateConnection('Could not join room. Check code and try again.');
      });
    }

    function startGame() {
      primeAudio();
      if (mode !== 'ai') {
        updateStatus('Use Host/Join for online mode.');
        return;
      }

      difficulty = difficultySelect.value;
      gameStarted = true;
      resetBoard();
      player = 'X';
      updateTurnStatus();
      setBoardDisabled(false);
    }

    function manualNewGame() {
      if (!gameStarted) {
        updateStatus(mode === 'ai' ? 'Choose difficulty and press Start.' : 'Host or join a room first.');
        return;
      }
      if (animatingReset) {
        return;
      }

      resetBoard();
      player = 'X';
      updateTurnStatus();

      if (mode === 'online') {
        sendOnlineMessage({ type: 'reset' });
        setBoardDisabled(!isHumanTurn());
      } else {
        setBoardDisabled(false);
      }
    }

    function updateModeUi() {
      mode = modeSelect.value;
      const online = mode === 'online';

      onlineControls.classList.toggle('active', online);
      difficultySelect.disabled = online;
      startBtn.disabled = online;

      if (online) {
        updateStatus('Create or join a room to start online 1v1.');
        setBoardDisabled(true);
      } else {
        disconnectOnline();
        gameStarted = false;
        resetBoard();
        updateConnection('');
        updateStatus('Choose difficulty and press Start.');
        setBoardDisabled(true);
      }
    }

    function moveSelection(deltaRow, deltaCol) {
      const row = Math.floor(selectedIndex / 3);
      const col = selectedIndex % 3;
      const nextRow = Math.max(0, Math.min(2, row + deltaRow));
      const nextCol = Math.max(0, Math.min(2, col + deltaCol));
      setSelectedIndex(nextRow * 3 + nextCol);
    }

    function activateSelectedCell() {
      if (!gameStarted || gameOver || animatingReset || !isHumanTurn()) {
        return;
      }
      const cell = cells[selectedIndex];
      if (!cell || cell.disabled) {
        return;
      }
      cell.click();
    }

    function handleKeyboard(event) {
      if (event.repeat) {
        return;
      }

      if (event.key === 'ArrowUp') {
        event.preventDefault();
        moveSelection(-1, 0);
      } else if (event.key === 'ArrowDown') {
        event.preventDefault();
        moveSelection(1, 0);
      } else if (event.key === 'ArrowLeft') {
        event.preventDefault();
        moveSelection(0, -1);
      } else if (event.key === 'ArrowRight') {
        event.preventDefault();
        moveSelection(0, 1);
      } else if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        activateSelectedCell();
      } else if (event.key.toLowerCase() === 's') {
        event.preventDefault();
        startGame();
      }
    }

    function pollGamepad() {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      const pad = pads && pads[0];

      if (pad) {
        const currentState = {
          up: Boolean(pad.buttons[12] && pad.buttons[12].pressed),
          down: Boolean(pad.buttons[13] && pad.buttons[13].pressed),
          left: Boolean(pad.buttons[14] && pad.buttons[14].pressed),
          right: Boolean(pad.buttons[15] && pad.buttons[15].pressed),
          select: Boolean(pad.buttons[0] && pad.buttons[0].pressed),
          start: Boolean(pad.buttons[9] && pad.buttons[9].pressed)
        };

        if (currentState.up && !previousPadState.up) {
          moveSelection(-1, 0);
        }
        if (currentState.down && !previousPadState.down) {
          moveSelection(1, 0);
        }
        if (currentState.left && !previousPadState.left) {
          moveSelection(0, -1);
        }
        if (currentState.right && !previousPadState.right) {
          moveSelection(0, 1);
        }
        if (currentState.select && !previousPadState.select) {
          activateSelectedCell();
        }
        if (currentState.start && !previousPadState.start) {
          startGame();
        }

        previousPadState = currentState;
      }

      gamepadFrameId = requestAnimationFrame(pollGamepad);
    }

    cells.forEach((cell) => {
      cell.addEventListener('click', onCellClick);
    });

    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', manualNewGame);
    hostBtn.addEventListener('click', hostOnlineGame);
    joinBtn.addEventListener('click', joinOnlineGame);

    difficultySelect.addEventListener('change', () => {
      difficulty = difficultySelect.value;
      if (mode === 'ai' && gameStarted) {
        resetBoard();
        updateTurnStatus();
        setBoardDisabled(false);
      }
    });

    modeSelect.addEventListener('change', updateModeUi);
    roomCodeInput.addEventListener('input', () => {
      roomCodeInput.value = roomCodeInput.value.replace(/\D/g, '').slice(0, 4);
    });
    document.addEventListener('keydown', handleKeyboard);
    document.addEventListener('pointerdown', unlockAudio, { passive: true });
    document.addEventListener('touchstart', unlockAudio, { passive: true });

    updateConnection('');
    updateStatus('Choose difficulty and press Start.');
    setBoardDisabled(true);
    refreshSelectedCell();
    if (!gamepadFrameId) {
      gamepadFrameId = requestAnimationFrame(pollGamepad);
    }
  </script>
</body>
</html>
